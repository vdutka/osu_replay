<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>osu! replay viewer</title>
  <style>
    :root{color-scheme:dark;font:14px/1.4 Arial,Helvetica,sans-serif;background:#000;color:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}.shell{position:relative;height:100%;background:#000}.stage{position:absolute;inset:0;overflow:hidden}canvas{display:block;width:100%;height:100%;background:#000}
    header{display:flex;align-items:center;gap:16px;position:absolute;inset:0 0 auto;z-index:3;padding:18px 20px 56px;background:linear-gradient(#000b,transparent);pointer-events:none;transition:opacity .3s cubic-bezier(.2,0,0,1);will-change:opacity}.title{flex:1;min-width:0;font-size:18px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
    button{font:inherit;color:inherit;border:0;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,.file-label:focus-within{outline:2px solid #fff;outline-offset:-2px}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;pointer-events:none}
    .player-controls{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:48px 12px 8px;background:linear-gradient(transparent,#000c);transition:opacity .3s cubic-bezier(.2,0,0,1);will-change:opacity}.toolbar{display:flex;align-items:center;gap:6px;height:48px}.toolbar button,#close{display:flex;align-items:center;justify-content:center;flex:0 0 48px;width:48px;height:48px;padding:12px;background:linear-gradient(145deg,#ffffff20,#ffffff08 48%,#ffffff12);border-radius:50%;backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 #ffffff52,inset 0 -1px 0 #ffffff12,0 3px 12px #0003;filter:drop-shadow(0 1px 1px #0008)}.toolbar button:hover,#close:hover{background:linear-gradient(145deg,#ffffff38,#ffffff12 48%,#ffffff22);box-shadow:inset 0 1px 0 #ffffff80,inset 0 0 0 1px #ffffff28,0 4px 16px #0004}.toolbar svg,#close svg{display:block;width:24px;height:24px;fill:currentColor}.spacer{flex:1}#clock{font-size:13px;white-space:nowrap;padding:0 10px;font-variant-numeric:tabular-nums}.volume-control{display:flex;align-items:center;height:48px}.volume-control button{flex-basis:40px;width:40px;height:40px;padding:8px}.volume-control input{width:64px;margin:0 8px 0 0}
    input[type=range]{appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;height:20px;padding:0}input[type=range]::-webkit-slider-runnable-track{height:3px;transition:height .18s ease;background:linear-gradient(to right,var(--range-color,#fff) var(--progress,70%),#ffffff45 var(--progress,70%))}input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--range-color,#fff);margin-top:-4.5px;transition:margin-top .18s ease,opacity .18s ease}input[type=range]:focus-visible{outline:none}input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px #ffffff20,0 0 10px #ffffff30}#seek:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px #ff66aa26,0 0 12px #ff66aa55}#seek{--range-color:#ff66aa;display:block;width:100%;height:16px;margin:0}#seek::-webkit-slider-thumb{opacity:0;transition:opacity .18s ease}#seek:hover::-webkit-slider-thumb,#seek:focus-visible::-webkit-slider-thumb{opacity:1}#seek::-webkit-slider-runnable-track{border-radius:999px}
    .statusbar{font-size:11px;color:#ccc;padding:0 12px;min-height:15px}#status{white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}.error{color:#ffb1b1}.settings-panel{position:absolute;right:12px;bottom:96px;width:320px;max-width:calc(100% - 24px);max-height:calc(100% - 150px);overflow:auto;padding:12px 0;background:radial-gradient(ellipse at 8% 0%,#ffffff24,transparent 58%),linear-gradient(145deg,#79738338,#17151f80);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);border:1px solid #ffffff30;border-radius:24px;box-shadow:inset 0 1px 1px #ffffff55,inset 0 -1px 0 #ffffff0d,0 16px 48px #0005;z-index:5}.settings-panel{opacity:1;transform:translateY(0) scale(1);transform-origin:bottom right;transition:opacity .32s cubic-bezier(.2,.8,.2,1),transform .32s cubic-bezier(.16,1,.3,1),display .32s allow-discrete}.settings-panel[hidden]{display:none;opacity:0;transform:translateY(12px) scale(.94)}@starting-style{.settings-panel{opacity:0;transform:translateY(12px) scale(.94)}}.panel-heading{font-size:13px;font-weight:600;padding:4px 20px 12px;border-bottom:1px solid #ffffff20}.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:8px 20px;font-size:13px}.setting,.file-label,.files button{transition:background .2s ease,box-shadow .2s ease}.setting{margin:2px 8px;border-radius:14px;padding:8px 12px}.setting:hover,.file-label:hover,.files button:hover{background:#ffffff14;box-shadow:inset 0 1px 0 #ffffff12}.setting select{color:#fff;border:0;background:#ffffff12;box-shadow:inset 0 1px 0 #ffffff24;padding:8px;border-radius:12px}#tint{width:80px}#tint-value{min-width:30px}.files{display:grid;border-top:1px solid #ffffff20;margin-top:8px;padding-top:8px}.file-label,.files button{border-radius:10px;margin:0 8px;display:block;text-align:left;padding:12px 20px;background:transparent;font-size:13px;cursor:pointer}input[type=file]{display:none}.controls-hidden header,.controls-hidden .player-controls{opacity:0;pointer-events:none}.controls-hidden .stage{cursor:none}#close{pointer-events:auto;transition:background .18s ease,box-shadow .18s ease}button{transition:background .18s ease}.controls-hidden header #close{pointer-events:none}.exit-fullscreen{display:none}.is-fullscreen .enter-fullscreen{display:none}.is-fullscreen .exit-fullscreen{display:block}
    .settings-panel{padding:0;overflow-x:hidden}.settings-views{position:relative;height:304px;overflow:hidden;transition:height .32s cubic-bezier(.16,1,.3,1)}.settings-page{position:absolute;top:0;left:0;width:100%;padding:12px 0;opacity:1;transform:translateX(0);transition:opacity .24s ease,transform .32s cubic-bezier(.16,1,.3,1),visibility .32s}.settings-page[aria-hidden=true]{visibility:hidden;pointer-events:none}#speed-page{transform:translateX(100%);opacity:0}.speed-view #settings-home{transform:translateX(-35%);opacity:0}.speed-view #speed-page{transform:translateX(0);opacity:1}.settings-navigation{width:calc(100% - 16px);background:transparent;color:inherit;text-align:left}.settings-navigation>span:last-child{display:flex;align-items:center;gap:14px;color:#ddd}.menu-chevron{font-size:23px;line-height:1}.speed-heading{display:flex;align-items:center;gap:8px;padding:0 12px 10px;border-bottom:1px solid #ffffff20;font-size:13px;font-weight:600}.glass-round{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:linear-gradient(145deg,#ffffff20,#ffffff09);box-shadow:inset 0 1px 0 #ffffff30,0 2px 8px #0002;font-size:24px;transition:background .2s ease,transform .2s ease,box-shadow .2s ease}.glass-round:hover{background:#ffffff26;box-shadow:inset 0 1px 0 #ffffff50}.glass-round:active{transform:scale(.92)}.speed-body{padding:22px 16px 10px}#speed-value{display:block;text-align:center;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}.speed-adjust{display:flex;align-items:center;gap:14px;margin:22px 0}#speed{width:100%;min-width:0;--range-color:#ff9bc8}#speed::-webkit-slider-runnable-track{border-radius:999px}#speed::-webkit-slider-thumb{box-shadow:0 1px 5px #0005;transition:box-shadow .18s ease,transform .18s ease}#speed:hover::-webkit-slider-thumb{box-shadow:0 0 0 4px #ff66aa20}#speed:active::-webkit-slider-thumb{transform:scale(1.15)}.speed-presets{display:flex;gap:6px}.speed-presets button{flex:1;min-width:0;padding:9px 2px;border-radius:999px;background:linear-gradient(145deg,#ffffff16,#ffffff08);box-shadow:inset 0 1px 0 #ffffff16;font-size:12px;transition:background .2s ease,box-shadow .2s ease,transform .2s ease}.speed-presets button:hover{background:#ffffff25}.speed-presets button[aria-pressed=true]{background:#ff66aa28;box-shadow:inset 0 0 0 1px #ff99c46b}.speed-presets button:active{transform:scale(.95)}#speed-description{margin:9px 4px 0;font-size:11px;color:#ddd}@media(prefers-reduced-motion:reduce){.settings-views,.settings-page,.glass-round,.speed-presets button{transition:none!important}}
    @media(max-width:640px){header{padding:12px 14px 40px}.title{flex:1;min-width:0;font-size:16px}.player-controls{padding:32px 8px 6px}.toolbar button{flex-basis:40px;width:40px;height:40px;padding:8px}.volume-control input{width:42px}#clock{padding:0 5px;font-size:12px}.statusbar{padding:0 8px}.settings-panel{bottom:92px}}
    @media(prefers-reduced-motion:reduce){header,.player-controls,.settings-panel,button,input[type=range]::-webkit-slider-runnable-track,input[type=range]::-webkit-slider-thumb{transition:none!important}}
  </style>
<link rel="stylesheet" href="hosted-mobile.css">
</head>
<body>
  <main class="shell">
    <header><div id="title" class="title">osu! replay viewer</div><button id="close" aria-label="Close replay viewer" title="Close replay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg></button></header>
    <div class="stage"><canvas id="playfield" width="1024" height="768" aria-label="Replay playfield"></canvas><div class="sr-only" aria-live="polite"><output id="hud-state">LIVE</output><output id="pp-value">0 PP</output><output id="hit-great">0</output><output id="hit-good">0</output><output id="hit-meh">0</output><output id="hit-miss">0</output></div></div>
    <section id="settings-panel" class="settings-panel" aria-label="Player settings" hidden><div class="settings-views"><div id="settings-home" class="settings-page"><div class="panel-heading">PLAYER SETTINGS</div><button id="speed-open" class="setting settings-navigation" aria-controls="speed-page" aria-expanded="false"><span>Playback speed</span><span><span id="speed-summary">Normal</span><span class="menu-chevron" aria-hidden="true">›</span></span></button><label class="setting">Background dim <input id="tint" type="range" min="0" max="100" step="1" value="80" aria-label="Background tint"><output id="tint-value" for="tint">80%</output></label><div class="files"><label class="file-label">Open replay .osr<input id="replay-file" type="file" accept=".osr"></label><label class="file-label">Open beatmap .osz<input id="map-file" type="file" accept=".osz"></label><button id="clear-cache">Clear download cache</button></div></div><div id="speed-page" class="settings-page" aria-hidden="true" inert><div class="speed-heading"><button id="speed-back" class="glass-round" aria-label="Back to player settings">‹</button><span>Playback speed</span></div><div class="speed-body"><output id="speed-value" for="speed">1.00×</output><div class="speed-adjust"><button id="speed-minus" class="glass-round" aria-label="Decrease playback speed">−</button><input id="speed" type="range" min="0.5" max="3" step="0.05" value="1" aria-label="Playback speed"><button id="speed-plus" class="glass-round" aria-label="Increase playback speed">+</button></div><div class="speed-presets" aria-label="Playback speed presets"><button data-speed="1" aria-pressed="true">1×</button><button data-speed="1.25" aria-pressed="false">1.25×</button><button data-speed="1.5" aria-pressed="false">1.5×</button><button data-speed="2" aria-pressed="false">2×</button><button data-speed="3" aria-pressed="false">3×</button></div></div></div></div></section>
    <div class="player-controls"><input id="seek" type="range" min="0" max="1" value="0" step="0.001" aria-label="Seek"><div class="toolbar"><button id="toggle" disabled aria-label="Play" title="Play (Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button><button id="restart" aria-label="Restart replay" title="Restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button><div class="volume-control"><button id="mute" aria-label="Mute" title="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13 3a4 4 0 0 0-2-3.46v6.92A4 4 0 0 0 16 12zm-2-8v2a6.3 6.3 0 0 1 0 12v2a8.3 8.3 0 0 0 0-16z"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"></div><span id="clock">0:00 / 0:00</span><div class="spacer"></div><button id="settings" aria-label="Player settings" aria-expanded="false" aria-controls="settings-panel" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m19.4 13 .1-1-.1-1 2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.7-1L15 3h-4l-.4 3a8 8 0 0 0-1.7 1L6.5 6l-2 3.4 2 1.6-.1 1 .1 1-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.4 3h4l.4-3a8 8 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7"/></svg></button><button id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter-fullscreen" d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z"/><path class="exit-fullscreen" d="M8 3h2v7H3V8h5zm6 0h2v5h5v2h-7zM3 14h7v7H8v-5H3zm11 0h7v2h-5v5h-2z"/></svg></button></div><div class="statusbar"><span id="status" role="status">Loading…</span></div></div>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
